<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">用现成模板搭一个 Python 工作台</title><desc id="desc">从 Registry 找到模板，准备环境，再上传自己的程序。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1830"/><stop offset="1" stop-color="#173d4c"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#81d9d0" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="430" rx="24" fill="url(#bg)"/>
<g font-family="system-ui, Noto Sans CJK SC, sans-serif">
<text x="44" y="53" fill="#81d9d0" font-size="16" letter-spacing="3">BUILD WITH SANDBOX · 03</text>
<text x="44" y="104" fill="#f4f8ff" font-size="31" font-weight="700">用现成模板搭一个 Python 工作台</text>
<rect x="44" y="150" width="235" height="168" rx="14" fill="#18364c" stroke="#4c7a8b"/>
<text x="63" y="187" fill="#81d9d0" font-size="16">01</text>
<text x="63" y="224" fill="#fff" font-size="22" font-weight="650">选择模板</text>
<text x="63" y="260" fill="#d5e5f0" font-size="17">python-hello</text>
<text x="63" y="289" fill="#d5e5f0" font-size="16">环境定义与应用命令</text>
<path d="M283 234H300" stroke="#81d9d0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="309" y="150" width="235" height="168" rx="14" fill="#18364c" stroke="#4c7a8b"/>
<text x="328" y="187" fill="#81d9d0" font-size="16">02</text>
<text x="328" y="224" fill="#fff" font-size="22" font-weight="650">启动模板</text>
<text x="328" y="260" fill="#d5e5f0" font-size="17">abx template launch</text>
<text x="328" y="289" fill="#d5e5f0" font-size="16">等待应用就绪</text>
<path d="M548 234H565" stroke="#81d9d0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="574" y="150" width="235" height="168" rx="14" fill="#18364c" stroke="#4c7a8b"/>
<text x="593" y="187" fill="#81d9d0" font-size="16">03</text>
<text x="593" y="224" fill="#fff" font-size="22" font-weight="650">运行项目</text>
<text x="593" y="260" fill="#d5e5f0" font-size="17">上传 Python 文件</text>
<text x="593" y="289" fill="#d5e5f0" font-size="16">执行脚本、取回文件</text>
<path d="M813 234H830" stroke="#81d9d0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="839" y="150" width="235" height="168" rx="14" fill="#18364c" stroke="#4c7a8b"/>
<text x="858" y="187" fill="#81d9d0" font-size="16">04</text>
<text x="858" y="224" fill="#fff" font-size="22" font-weight="650">接入自己的程序</text>
<text x="858" y="260" fill="#d5e5f0" font-size="17">CLI / SDK / HTTP</text>
<text x="858" y="289" fill="#d5e5f0" font-size="16">取得结果后释放实例</text>
<text x="44" y="378" fill="#c9dbe8" font-size="18">从 Registry 找到模板，准备环境，再上传自己的程序。</text>
</g></svg>
