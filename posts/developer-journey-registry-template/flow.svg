<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">从 Registry 到 Sandbox：公开源码、构建、调用与清理</title>
<desc id="desc">从 Registry 选择 Python 模板，用 prepare_steps.py 准备云端构建。模板就绪后创建实例，上传脚本，通过终端、SDK 或 HTTP 使用应用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}.h{font-size:20px;font-weight:650;fill:#0f172a}.b{font-size:16px;fill:#475569}.s{font-size:14px;fill:#475569}.c{font-family:ui-monospace,monospace;font-size:15px;fill:#334155}.l{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="760" rx="28" fill="#f8fafc"/>
<text x="48" y="63" font-size="30" font-weight="700" fill="#0f172a">从 Python 模板到自己的远程工作台</text>
<text x="48" y="96" class="b">Registry python-hello · 官方 steps 准备路径 · Alibaba Cloud Express</text>
<rect x="48" y="134" width="265" height="140" rx="16" fill="white" stroke="#cbd5e1"/>
<text x="68" y="168" class="h">① 公开模板源码</text><text x="68" y="199" class="b">Registry 页面 → 模板目录</text><text x="68" y="226" font-size="13" fill="#334155">template.yaml · commands.py</text><text x="68" y="252" class="s">查看环境配置与应用命令</text>
<path d="M313 204H349" class="l"/>
<rect x="360" y="134" width="265" height="140" rx="16" fill="white" stroke="#cbd5e1"/>
<text x="380" y="168" class="h">② 官方准备工具</text><text x="380" y="199" class="c">prepare_steps.py</text><text x="380" y="226" class="b">生成独立 steps 配方</text><text x="380" y="252" class="s">把本地源码纳入构建步骤</text>
<path d="M625 204H661" class="l"/>
<rect x="672" y="134" width="265" height="140" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
<text x="692" y="168" class="h">③ 云端构建</text><text x="692" y="199" class="c">deploy --build steps</text><text x="692" y="226" font-size="14" fill="#475569">submitted → building → READY</text><text x="692" y="252" class="s">查看状态，等构建完成</text>
<path d="M937 204H973" class="l"/>
<rect x="984" y="134" width="248" height="140" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="1004" y="168" class="h">④ 创建 sandbox</text><text x="1004" y="199" class="c">abx create TEMPLATE_ID</text><text x="1004" y="226" class="b">保存创建返回的实例 ID</text><text x="1004" y="252" class="s">服务端 0.3.0 · 端口 9000</text>
<path d="M1108 274V315H640V343" class="l"/>
<rect x="48" y="354" width="1184" height="218" rx="18" fill="white" stroke="#cbd5e1"/>
<text x="72" y="389" class="h">⑤ 在同一个工作台中开发与调用</text>
<rect x="72" y="411" width="353" height="132" rx="12" fill="#f1f5f9"/>
<text x="92" y="441" class="h">CLI</text><text x="92" y="470" class="b">运行脚本 · 上传下载 · 系统状态</text><text x="92" y="497" class="b">查看进程 · 打开交互终端</text><text x="92" y="524" class="s">需要排查时直接进入环境</text>
<rect x="449" y="411" width="353" height="132" rx="12" fill="#f1f5f9"/>
<text x="469" y="441" class="h">Python SDK</text><text x="469" y="470" class="c">ProviderSandbox.connect</text><text x="469" y="497" class="c">application_client(9000)</text><text x="469" y="524" class="s">hello → Hello, Python!</text>
<rect x="826" y="411" width="382" height="132" rx="12" fill="#f1f5f9"/>
<text x="846" y="441" class="h">外部 HTTP</text><text x="846" y="470" class="b">控制机 → 实际公网应用地址</text><text x="846" y="497" class="b">POST /commands/hello</text><text x="846" y="524" class="s">将 JSON 结果交给调用方</text>
<path d="M640 572V605" class="l"/>
<rect x="48" y="617" width="1184" height="95" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="72" y="651" class="h">⑥ 保存结果，释放临时实例</text><text x="72" y="682" class="b">下载需要保留的文件 → kill sandbox；模板可以留给下次任务复用</text>
<rect x="967" y="636" width="241" height="52" rx="26" fill="#065f46"/><text x="1087" y="669" text-anchor="middle" font-size="19" font-weight="650" fill="white">保留模板，下次再用</text>
<text x="48" y="741" class="s">本文使用 Express 云端 steps 路径；本机不需要 Docker。</text>
</svg>
