<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">从 Registry 到 Sandbox：公开源码、构建、调用与清理</title>
<desc id="desc">固定公开源码经官方 prepare_steps.py 准备后部署，等待 READY 才创建 sandbox。CLI、SDK 和外部 HTTP 检查同一实例，最后删除精确资源并回读不存在。正式 CLI 0.4.12 和 host SDK 0.3.1a2 的 29 项断言通过。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>text{font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif}.h{font-size:20px;font-weight:650;fill:#0f172a}.b{font-size:16px;fill:#475569}.s{font-size:14px;fill:#475569}.c{font-family:ui-monospace,monospace;font-size:15px;fill:#334155}.l{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="760" rx="28" fill="#f8fafc"/>
<text x="48" y="63" font-size="30" font-weight="700" fill="#0f172a">一个模板，三种调用入口，一份可复现证据</text>
<text x="48" y="96" class="b">Registry python-hello · 官方 steps 准备路径 · Alibaba Cloud Express</text>
<rect x="48" y="134" width="265" height="140" rx="16" fill="white" stroke="#cbd5e1"/>
<text x="68" y="168" class="h">① 公开模板源码</text><text x="68" y="199" class="b">Registry 页面 → 固定 Git SHA</text><text x="68" y="226" font-size="13" fill="#334155">template.yaml · commands.py</text><text x="68" y="252" class="s">记录输入哈希与 server 源码 pin</text>
<path d="M313 204H349" class="l"/>
<rect x="360" y="134" width="265" height="140" rx="16" fill="white" stroke="#cbd5e1"/>
<text x="380" y="168" class="h">② 官方准备工具</text><text x="380" y="199" class="c">prepare_steps.py</text><text x="380" y="226" class="b">生成独立 steps 配方</text><text x="380" y="252" class="s">保存 steps-provenance.json</text>
<path d="M625 204H661" class="l"/>
<rect x="672" y="134" width="265" height="140" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
<text x="692" y="168" class="h">③ 云端构建</text><text x="692" y="199" class="c">deploy --build steps</text><text x="692" y="226" font-size="14" fill="#475569">submitted → building → READY</text><text x="692" y="252" class="s">按精确 TemplateID 有限轮询</text>
<path d="M937 204H973" class="l"/>
<rect x="984" y="134" width="248" height="140" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="1004" y="168" class="h">④ 创建 sandbox</text><text x="1004" y="199" class="c">abx create TEMPLATE_ID</text><text x="1004" y="226" class="b">保留私有精确资源 ID</text><text x="1004" y="252" class="s">服务端 0.3.0 · 端口 9000</text>
<path d="M1108 274V315H640V343" class="l"/>
<rect x="48" y="354" width="1184" height="218" rx="18" fill="white" stroke="#cbd5e1"/>
<text x="72" y="389" class="h">⑤ 同一实例上的真实行为检查</text>
<rect x="72" y="411" width="353" height="132" rx="12" fill="#f1f5f9"/>
<text x="92" y="441" class="h">CLI</text><text x="92" y="470" class="b">命名命令 · 文件往返 · 系统状态</text><text x="92" y="497" class="b">后台进程 · SIGTERM · 真实 PTY</text><text x="92" y="524" class="s">校验内容、退出码与会话状态</text>
<rect x="449" y="411" width="353" height="132" rx="12" fill="#f1f5f9"/>
<text x="469" y="441" class="h">Python SDK</text><text x="469" y="470" class="c">ProviderSandbox.connect</text><text x="469" y="497" class="c">application_client(9000)</text><text x="469" y="524" class="s">hello → Hello, Python!</text>
<rect x="826" y="411" width="382" height="132" rx="12" fill="#f1f5f9"/>
<text x="846" y="441" class="h">外部 HTTP</text><text x="846" y="470" class="b">控制机 → 实际公网应用地址</text><text x="846" y="497" class="b">成功 200 · 缺参 400 · 未知命令 404</text><text x="846" y="524" class="s">记录状态、JSON 结果和发现列表</text>
<path d="M640 572V605" class="l"/>
<rect x="48" y="617" width="1184" height="95" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="72" y="651" class="h">⑥ 精确清理与留证</text><text x="72" y="682" class="b">kill sandbox → 回读 SandboxNotFound；delete template → 回读 TemplateNotFound / 404</text>
<rect x="967" y="636" width="241" height="52" rx="26" fill="#065f46"/><text x="1087" y="669" text-anchor="middle" font-size="19" font-weight="650" fill="white">29 / 29 断言通过</text>
<text x="48" y="741" class="s">已实测：CLI 0.4.12 / host SDK 0.3.1a2。范围限定 steps；未声明 Docker 或其他 provider 验收。</text>
</svg>
