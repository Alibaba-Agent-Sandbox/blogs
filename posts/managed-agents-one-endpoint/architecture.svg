<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title description">
  <title id="title">统一 Gateway 与每个 Session 独占的 Sandbox</title>
  <desc id="description">业务客户端只连接 Gateway。Gateway、Dispatcher、Worker 位于 Server 一侧，共用 PostgreSQL 持久状态。Dispatcher 派发任务给 Worker，由 Worker 绑定和观测各 Session 的 Sandbox；Agent CLI、模型 API 调用、工具循环和工作区位于各自 Sandbox。图表示逻辑职责，不声明额外的高可用或敌对代码隔离保证。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#465fbd"/></marker>
    <marker id="state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#377d8a"/></marker>
  </defs>
  <rect width="1100" height="700" rx="20" fill="#f7f9ff"/>
  <g font-family="system-ui, sans-serif" fill="#152342">
    <text x="32" y="44" font-size="25" font-weight="700">一个业务入口，按 Session 管理执行环境</text>
    <rect x="270" y="74" width="430" height="548" rx="18" fill="#edf2ff" stroke="#b4c2ed" stroke-width="2"/>
    <text x="292" y="104" font-size="19" font-weight="700">Server：托管控制面</text>
    <rect x="28" y="138" width="210" height="132" rx="14" fill="#ffffff" stroke="#7790cc" stroke-width="2"/>
    <text x="48" y="174" font-size="20" font-weight="700">业务客户端</text>
    <text x="48" y="205" font-size="17">Gateway URL</text>
    <text x="48" y="232" font-size="17">Business Key</text>
    <rect x="300" y="138" width="160" height="112" rx="13" fill="#ffffff" stroke="#7790cc" stroke-width="2"/>
    <text x="321" y="176" font-size="21" font-weight="700">Gateway</text>
    <text x="321" y="207" font-size="16">受理请求</text>
    <text x="321" y="230" font-size="16">查询 / 事件 / 文件</text>
    <rect x="300" y="302" width="160" height="102" rx="13" fill="#ffffff" stroke="#7790cc" stroke-width="2"/>
    <text x="316" y="343" font-size="20" font-weight="700">Dispatcher</text>
    <text x="320" y="375" font-size="16">读取待办并派发</text>
    <rect x="300" y="482" width="160" height="108" rx="13" fill="#ffffff" stroke="#7790cc" stroke-width="2"/>
    <text x="331" y="522" font-size="21" font-weight="700">Worker</text>
    <text x="320" y="553" font-size="16">绑定 / 观测 / 回收</text>
    <rect x="495" y="276" width="180" height="172" rx="16" fill="#e7f4f5" stroke="#78aab2" stroke-width="2"/>
    <text x="514" y="311" font-size="20" font-weight="700">PostgreSQL</text>
    <text x="514" y="341" font-size="17">共享持久状态</text>
    <text x="514" y="370" font-size="16">会话 · 提交 · 事件</text>
    <text x="514" y="399" font-size="16">产物元数据</text>
    <text x="514" y="427" font-size="15" fill="#3e6970">独立于 FC 本机内存</text>
    <g fill="none" stroke-width="2.5">
      <path d="M238 194H300" stroke="#465fbd" marker-end="url(#arrow)"/>
      <path d="M460 194H585V276" stroke="#377d8a" marker-end="url(#state-arrow)"/>
      <path d="M495 353H460" stroke="#377d8a" marker-start="url(#state-arrow)" marker-end="url(#state-arrow)"/>
      <path d="M380 404V482" stroke="#465fbd" marker-end="url(#arrow)"/>
      <path d="M460 536H585V448" stroke="#377d8a" marker-start="url(#state-arrow)" marker-end="url(#state-arrow)"/>
      <path d="M460 511H730V233H770" stroke="#465fbd" marker-end="url(#arrow)"/>
      <path d="M460 565H730V489H770" stroke="#465fbd" marker-end="url(#arrow)"/>
    </g>
    <text x="394" y="449" font-size="15" fill="#465fbd">派发</text>
    <rect x="770" y="154" width="302" height="172" rx="16" fill="#f0ecff" stroke="#a494d1" stroke-width="2"/>
    <text x="790" y="190" font-size="21" font-weight="700">Session A 的 Sandbox</text>
    <text x="790" y="223" font-size="17">Agent CLI · 模型 API 调用</text>
    <text x="790" y="253" font-size="17">工具循环 · 独占工作区</text>
    <text x="790" y="285" font-size="16" fill="#5d5480">同会话后续轮次复用</text>
    <rect x="770" y="410" width="302" height="172" rx="16" fill="#f0ecff" stroke="#a494d1" stroke-width="2"/>
    <text x="790" y="446" font-size="21" font-weight="700">Session B 的 Sandbox</text>
    <text x="790" y="479" font-size="17">Agent CLI · 模型 API 调用</text>
    <text x="790" y="509" font-size="17">工具循环 · 独占工作区</text>
    <text x="790" y="541" font-size="16" fill="#5d5480">与 Session A 分配不同实例</text>
    <text x="770" y="372" font-size="16" fill="#5d5480">首次输入时按需创建</text>
    <text x="32" y="656" font-size="18">普通业务调用方不需要 Sandbox 管理凭据；Close 释放计算，Delete 删除公开资源。</text>
    <text x="32" y="682" font-size="15" fill="#5a6886">箭头表示逻辑职责和数据流。工程验收中的私有 Provider 观察器不属于业务客户端。</text>
  </g>
</svg>
