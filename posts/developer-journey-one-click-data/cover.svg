<text x="593" y="289" fill="#d5e5f0" font-size="16">6 条有效 / 193.10</text>
<path d="M813 234H830" stroke="#81d9d0" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="839" y="150" width="235" height="168" rx="14" fill="#18364c" stroke="#4c7a8b"/>
<text x="858" y="187" fill="#81d9d0" font-size="16">04</text>
