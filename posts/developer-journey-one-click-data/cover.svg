<text x="858" y="289" fill="#d5e5f0" font-size="16">DELETE 204 → GET 404</text>
<text x="44" y="378" fill="#c9dbe8" font-size="18">图中数值来自真实复验；审计观察真实 HTTP，没有替换返回结果。</text>
