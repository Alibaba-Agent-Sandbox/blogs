<rect width="1120" height="430" rx="24" fill="url(#bg)"/>
<g font-family="system-ui, Noto Sans CJK SC, sans-serif">
<text x="44" y="53" fill="#81d9d0" font-size="16" letter-spacing="3">DEVELOPER JOURNEY · 05</text>
<text x="44" y="104" fill="#f4f8ff" font-size="32" font-weight="700">一次调用，远端计算，独立验收</text>
